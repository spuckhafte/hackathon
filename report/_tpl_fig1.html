<svg viewBox="0 0 1120 586" xmlns="http://www.w3.org/2000/svg" role="img"

    <text class="sub" x="532" y="353">/n · /s · /p · phrase</text>

    <text class="nt" x="276" y="0">solid = data flow &nbsp;·&nbsp; dashed = consulted, not consumed</text>

<figcaption><b>Figure 1 — the NyayaTrace pipeline.</b> The build row runs once;
the stores row is what exists on disk (S1–S5 of the team contract); the query row
is what executes per search; the bottom row is what the user is shown. Colour is
ownership, which is also how the work was divided (§7). Note that
<code>analyze()</code> is the only path into the index <em>and</em> the only path
into a query, which is the invariant the whole system is built on.</figcaption>
</figure>
