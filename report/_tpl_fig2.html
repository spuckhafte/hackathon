<figure>
<svg viewBox="0 0 1120 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="nDCG at 10 by system, B0 0.610 rising to S3 0.883 and S4 0.879">
  <defs><style>
    .ax { stroke:#aeb6c0; stroke-width:1; }
    .gd { stroke:#e2e6ea; stroke-width:1; }
    .bl { font-family:"Inter",Arial,sans-serif; font-size:14px; font-weight:600; fill:#16191d; }
    .bs { font-family:"Inter",Arial,sans-serif; font-size:10.5px; fill:#616a75; }
    .vl { font-family:"Inter",Arial,sans-serif; font-size:12px; font-weight:600; fill:#16191d; }
    .tk { font-family:"Inter",Arial,sans-serif; font-size:9.5px; fill:#8a929c; }
  </style></defs>

  <!-- gridlines: y = 240 is 0.0, y = 60 is 1.0, so 180px spans the unit interval -->
  <line class="gd" x1="130" y1="60"  x2="1090" y2="60"/>
  <line class="gd" x1="130" y1="120" x2="1090" y2="120"/>
  <line class="gd" x1="130" y1="180" x2="1090" y2="180"/>
  <line class="ax" x1="130" y1="240" x2="1090" y2="240"/>
  <text class="bs" x="124" y="48" text-anchor="end">nDCG@10</text>
  <text class="tk" x="124" y="63"  text-anchor="end">1.00</text>
  <text class="tk" x="124" y="123" text-anchor="end">0.67</text>
  <text class="tk" x="124" y="183" text-anchor="end">0.33</text>
  <text class="tk" x="124" y="243" text-anchor="end">0</text>

  <!-- B0 .610  S1 .642  S2 .671  S2' .798 : y = 240 - 180*v -->
  <g fill="#c9d3dc">
    <rect x="160" y="130" width="110" height="110"/>
    <rect x="315" y="124" width="110" height="116"/>
    <rect x="470" y="119" width="110" height="121"/>
    <rect x="625" y="96"  width="110" height="144"/>
  </g>
  <!-- S3 .883 is the best measured row; S4 .879 is level with it, not above -->
  <rect x="780" y="81" width="110" height="159" fill="#e0b875"/>
  <rect x="935" y="82" width="110" height="158" fill="#e0b875"/>

  <path d="M 270 130 L 315 124 M 425 124 L 470 119 M 580 119 L 625 96 M 735 96 L 780 81 M 890 81 L 935 82"
        stroke="#aeb6c0" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <g text-anchor="middle">
    <text class="bl" x="215" y="262">B0</text>
    <text class="bl" x="370" y="262">S1</text>
    <text class="bl" x="525" y="262">S2</text>
    <text class="bl" x="680" y="262">S2&#8242;</text>
    <text class="bl" x="835" y="262" fill="#9a6b1f">S3</text>
    <text class="bl" x="990" y="262" fill="#9a6b1f">S4</text>

    <text class="vl" x="215" y="122">0.610</text>
    <text class="vl" x="370" y="116">0.642</text>
    <text class="vl" x="525" y="111">0.671</text>
    <text class="vl" x="680" y="88">0.798</text>
    <text class="vl" x="835" y="73" fill="#9a6b1f">0.883</text>
    <text class="vl" x="990" y="74" fill="#9a6b1f">0.879</text>

    <text class="bs" x="215" y="286">tf-idf baseline</text>
    <text class="bs" x="370" y="286">+ canonicalisation</text>
    <text class="bs" x="525" y="286">+ zone weights</text>
    <text class="bs" x="680" y="286">+ BM25F</text>
    <text class="bs" x="835" y="286">+ PageRank</text>
    <text class="bs" x="990" y="286">+ treatment, proximity</text>
  </g>

  <!-- S3 and S4 are level; mark it rather than letting the eye invent a step -->
  <g>
    <path d="M 835 52 L 835 44 L 990 44 L 990 52" stroke="#9a6b1f" stroke-width="1" fill="none"/>
    <text class="bs" x="912" y="38" text-anchor="middle" fill="#9a6b1f">level &#8212; &#8722;0.005, not a step</text>
  </g>
</svg>
<figcaption><b>Figure 2 &mdash; the ablation ladder, nDCG@10 on the 20 judged test
queries.</b> Each step adds exactly one idea to the one before it. The two largest
gains are BM25F (S2&#8242;, +0.127) and treatment-free authority (S3, +0.085). <b>S4
does not beat S3</b>: the gap is &minus;0.005 and we mark it as level rather than
drawing a step the data does not support &mdash; what S4 buys is not recommending
overruled law, which no relevance-pooled metric can see. S1&#8201;&rarr;&#8201;S2
raises nDCG@10 while <em>lowering</em> R@20 and MAP@20 (&sect;5.1); that row is kept
for the same reason.</figcaption>
</figure>
